<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu - Supabase</title>
    <!-- Memuat Tailwind CSS untuk desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat Supabase JS dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Konfigurasi Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Animasi loading sederhana */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8 flex justify-center min-h-screen">

    <div class="max-w-2xl w-full">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Buku Tamu</h1>
            <p class="text-gray-500">Tinggalkan pesan Anda menggunakan database Supabase.</p>
        </div>

        <!-- Kotak Peringatan Konfigurasi (Akan hilang jika kunci sudah diisi) -->
        <div id="config-warning" class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 mb-6 rounded-md shadow-sm hidden">
            <p class="font-bold">Konfigurasi Dibutuhkan!</p>
            <p class="text-sm">Anda belum memasukkan URL dan Kunci Anon Supabase di dalam kode HTML. Silakan edit file HTML ini dan masukkan kunci Anda.</p>
        </div>

        <!-- Form Tambah Pesan -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">Tulis Pesan</h2>
            
            <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

            <form id="guestbook-form" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nama</label>
                    <input type="text" id="name" required placeholder="Nama Anda..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Pesan</label>
                    <textarea id="message" required rows="3" placeholder="Pesan Anda..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"></textarea>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors flex justify-center items-center gap-2">
                    <span>Kirim Pesan</span>
                </button>
            </form>
        </div>

        <!-- Daftar Pesan -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-semibold">Daftar Tamu</h2>
                <button onclick="fetchMessages()" class="text-sm text-blue-600 hover:text-blue-800 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    Refresh
                </button>
            </div>
            
            <div id="messages-container" class="space-y-4">
                <div class="text-center py-8 text-gray-500">
                    <span class="loader mb-2"></span>
                    <p>Memuat pesan...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // PENTING: Ganti nilai di bawah ini dengan URL dan Kunci dari Supabase Anda!
        // =========================================================================
        const SUPABASE_URL = 'https://eaijtfzsepmhazaqpsaa.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhaWp0ZnpzZXBtaGF6YXFwc2FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDI3MDMsImV4cCI6MjEwODQxODcwM30.3cm4TDt6ruq7S9SblwcaciPiW8SgCT3mjP_Pig1XbE4';
        
        // Inisialisasi Supabase Client (diubah menjadi supabaseClient untuk mencegah konflik)
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Elemen DOM
        const form = document.getElementById('guestbook-form');
        const nameInput = document.getElementById('name');
        const messageInput = document.getElementById('message');
        const submitBtn = document.getElementById('submit-btn');
        const messagesContainer = document.getElementById('messages-container');
        const alertBox = document.getElementById('alert-box');
        const configWarning = document.getElementById('config-warning');

        // Fungsi untuk menampilkan pesan alert UI
        function showAlert(message, isError = false) {
            alertBox.textContent = message;
            alertBox.className = `mb-4 p-3 rounded-lg text-sm ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 5000);
        }

        // Cek apakah user sudah mengganti kunci default
        function checkConfig() {
            // DIPERBAIKI: Logika dikembalikan agar tidak memblokir kunci yang sudah benar
            if (SUPABASE_URL.includes('GANTI_DENGAN') || SUPABASE_ANON_KEY.includes('GANTI_DENGAN')) {
                configWarning.classList.remove('hidden');
                messagesContainer.innerHTML = '<p class="text-center text-red-500 py-4">Database belum dikonfigurasi.</p>';
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                return false;
            }
            // Sembunyikan kotak peringatan jika konfigurasi sudah benar
            configWarning.classList.add('hidden');
            return true;
        }

        // Fungsi untuk Mengambil Data (Read)
        async function fetchMessages() {
            if (!checkConfig()) return;

            messagesContainer.innerHTML = '<div class="text-center py-4"><span class="loader"></span></div>';

            try {
                // Query ke Supabase: Ambil dari tabel 'guestbook', urutkan berdasarkan waktu (terbaru di atas)
                const { data, error } = await supabaseClient
                    .from('guestbook')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // Kosongkan container
                messagesContainer.innerHTML = '';

                if (data.length === 0) {
                    messagesContainer.innerHTML = '<p class="text-center text-gray-500 py-4">Belum ada pesan. Jadilah yang pertama!</p>';
                    return;
                }

                // Tampilkan setiap data ke dalam HTML
                data.forEach(item => {
                    // Format tanggal
                    const date = new Date(item.created_at).toLocaleDateString('id-ID', {
                        day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    // Cegah serangan XSS sederhana
                    const safeName = item.name.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    const safeMessage = item.message.replace(/</g, "&lt;").replace(/>/g, "&gt;");

                    const messageEl = document.createElement('div');
                    messageEl.className = 'p-4 bg-gray-50 border border-gray-100 rounded-lg hover:shadow-sm transition-shadow';
                    messageEl.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-gray-800">${safeName}</h3>
                            <span class="text-xs text-gray-400">${date}</span>
                        </div>
                        <p class="text-gray-600 text-sm whitespace-pre-wrap">${safeMessage}</p>
                    `;
                    messagesContainer.appendChild(messageEl);
                });

            } catch (error) {
                console.error('Error fetching data:', error);
                messagesContainer.innerHTML = `<p class="text-center text-red-500 py-4">Gagal memuat data: ${error.message}</p>`;
            }
        }

        // Fungsi untuk Menambah Data (Create)
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Mencegah halaman reload

            if (!checkConfig()) return;

            const nameValue = nameInput.value.trim();
            const messageValue = messageInput.value.trim();

            if (!nameValue || !messageValue) return;

            // Ubah tombol jadi status loading
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="loader"></span> Mengirim...';
            submitBtn.disabled = true;

            try {
                // Insert data ke tabel 'guestbook'
                const { error } = await supabaseClient
                    .from('guestbook')
                    .insert([
                        { name: nameValue, message: messageValue }
                    ]);

                if (error) throw error;

                // Sukses
                showAlert('Pesan berhasil dikirim!');
                form.reset(); // Kosongkan form
                fetchMessages(); // Muat ulang daftar pesan

            } catch (error) {
                console.error('Error inserting data:', error);
                showAlert(`Gagal mengirim: ${error.message}`, true);
            } finally {
                // Kembalikan tombol ke kondisi semula
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        });

        // Jalankan fetchMessages saat halaman pertama kali dimuat
        window.onload = () => {
            if(checkConfig()){
                fetchMessages();
            }
        };
    </script>
</body>
</html>
